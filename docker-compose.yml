# Two-service stack for Dummy Shop, plus an observability stack.
#   api      -> combines the product catalog, cart and orders behind one Flask app.
#              Backed by MySQL (products + orders) and Redis (ephemeral carts).
#   gateway  -> the public entrypoint (port 8000); renders the UI and calls api.
#
# Observability (scrapes / collects from the two app services):
#   prometheus (:9090) scrapes api + gateway /metrics; evaluates alert rules.
#   alertmanager (:9093) receives fired alerts.
#   loki (:3100) stores logs; promtail ships every container's logs into it.
#   grafana (:3000) dashboards over Prometheus + Loki (admin / admin).
services:
  # ---- datastores ----------------------------------------------------------
  shop-db:
    image: mysql:8.0
    container_name: shop-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shopdb
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppass
    volumes:
      - shop_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  cart-redis:
    image: redis:7-alpine
    container_name: shop-cart-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- services ------------------------------------------------------------
  api:
    build: ./services/api
    container_name: shop-api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://shopuser:shoppass@shop-db:3306/shopdb
      REDIS_URL: redis://cart-redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      shop-db:
        condition: service_healthy
      cart-redis:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    container_name: shop-gateway
    restart: unless-stopped
    environment:
      SECRET_KEY: change-me-in-prod
      PRODUCT_SERVICE_URL: http://api:8001
      CART_SERVICE_URL: http://api:8001
      ORDER_SERVICE_URL: http://api:8001
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_healthy

  # ---- observability -------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: shop-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - gateway

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: shop-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"

  loki:
    image: grafana/loki:2.9.8
    container_name: shop-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    container_name: shop-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    container_name: shop-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  shop_db_data:
  prometheus_data:
  loki_data:
  grafana_data:
