# Two-service stack for Dummy Shop.
#   api      -> combines the product catalog, cart and orders behind one Flask app.
#              Backed by MySQL (products + orders) and Redis (ephemeral carts).
#   gateway  -> the public entrypoint (port 8000); renders the UI and calls api.
services:
  # ---- datastores ----------------------------------------------------------
  shop-db:
    image: mysql:8.0
    container_name: shop-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shopdb
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppass
    volumes:
      - shop_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  cart-redis:
    image: redis:7-alpine
    container_name: shop-cart-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- services ------------------------------------------------------------
  api:
    build: ./services/api
    container_name: shop-api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://shopuser:shoppass@shop-db:3306/shopdb
      REDIS_URL: redis://cart-redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      shop-db:
        condition: service_healthy
      cart-redis:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    container_name: shop-gateway
    restart: unless-stopped
    environment:
      SECRET_KEY: change-me-in-prod
      PRODUCT_SERVICE_URL: http://api:8001
      CART_SERVICE_URL: http://api:8001
      ORDER_SERVICE_URL: http://api:8001
    ports:
      - "8000:8000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  shop_db_data:
