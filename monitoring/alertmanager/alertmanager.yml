route:
  receiver: default
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  # No-op receiver: alerts are visible in the Alertmanager UI (:9093) but not
  # forwarded anywhere. Add a slack_configs / webhook_configs block here to
  # actually deliver notifications.
  - name: default
