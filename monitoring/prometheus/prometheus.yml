global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # Prometheus scrapes itself.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The e-commerce app services (instrumented with prometheus-flask-exporter).
  - job_name: ecommerce-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8001']
        labels:
          service: api

  - job_name: ecommerce-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8000']
        labels:
          service: gateway

  # Observability stack self-monitoring.
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: promtail
    static_configs:
      - targets: ['promtail:9080']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
